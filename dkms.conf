PACKAGE_NAME="uwe5622-ng"
PACKAGE_VERSION="6.18.0"

# DKMS 在 ${dkms_tree}/uwe5622-ng/6.18.0/build 里执行（软链到 /usr/src/uwe5622-ng-6.18.0）。
# 显式传入内核构建树：自编内核的 /lib/modules/<ver>/build 可能不存在或指向别处。
MAKE[0]="sh scripts/dkms-build.sh ${kernel_source_dir}"
CLEAN="make KDIR=${kernel_source_dir} BUILDSRC=$(pwd) clean"

BUILT_MODULE_NAME[0]="uwe5622_bsp_sdio"
BUILT_MODULE_LOCATION[0]="unisocwcn"
DEST_MODULE_LOCATION[0]="/extra/uwe5622"

BUILT_MODULE_NAME[1]="sprdwl_ng"
BUILT_MODULE_LOCATION[1]="unisocwifi"
DEST_MODULE_LOCATION[1]="/extra/uwe5622"

BUILT_MODULE_NAME[2]="sprdbt_tty"
BUILT_MODULE_LOCATION[2]="tty-sdio"
DEST_MODULE_LOCATION[2]="/extra/uwe5622"

BUILT_MODULE_NAME[3]="sunxi_addr"
BUILT_MODULE_LOCATION[3]="addr_mgt"
DEST_MODULE_LOCATION[3]="/extra/uwe5622"

AUTOINSTALL="yes"
